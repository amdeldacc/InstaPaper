[project]
name = "instapaper-cli"
version = "0.1.0"
description = "CLI tool to search and retrieve Instapaper articles"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "requests-oauthlib>=1.3",
    "toml>=0.10",
]

[project.scripts]
instapaper = "cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
